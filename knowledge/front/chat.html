<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="多模态RAG智能知识库问答：基于混合向量检索与多路召回的文档问答。">
    <title>智能问答 · 多模态RAG智能知识库</title>
    <link rel="icon" href="/front/assets/img/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/front/assets/css/tokens.css">
    <link rel="stylesheet" href="/front/assets/css/base.css">
    <link rel="stylesheet" href="/front/assets/css/components.css">
    <link rel="stylesheet" href="/front/assets/css/chat.css">
</head>
<body data-page="chat" data-api-port="8001">

<a class="skip-link" href="#main">跳到主要内容</a>

<header class="app-header">
    <div class="header-inner">
        <a class="brand" href="chat.html" aria-label="多模态RAG智能知识库首页">
            <img src="/front/assets/img/logo.svg" alt="" width="32" height="32">
            <span class="brand-name">
                <strong class="brand-full">多模态RAG智能知识库</strong>
                <strong class="brand-short">多模态 RAG</strong>
                <span>Knowledge Base</span>
            </span>
        </a>

        <nav class="nav" aria-label="主导航">
            <a class="nav-link" data-page-link="import" href="#">文档导入</a>
            <a class="nav-link is-active" href="chat.html" aria-current="page">智能问答</a>
        </nav>

        <div class="header-actions">
            <label class="switch">
                <input type="checkbox" id="streamToggle" checked>
                <span class="switch-track" aria-hidden="true"></span>
                <span class="switch-text">流式输出</span>
            </label>
            <button class="btn btn-ghost btn-sm" id="btnClear" type="button">
                <span data-icon="trash" data-icon-size="14" aria-hidden="true"></span>
                <span class="clear-label">清空对话</span>
            </button>
        </div>
    </div>
</header>

<main class="chat-shell" id="main">
    <div class="chat-scroll" id="scroller">
        <div class="thread" id="thread">
            <section class="chat-intro" id="chatIntro" aria-labelledby="introTitle">
                <div class="intro-mark" data-icon="sparkles" data-icon-size="26" aria-hidden="true"></div>
                <h1 id="introTitle">今天想了解什么？</h1>
                <p>从产品手册与维修指南中检索答案，并给出可追溯的处理过程。</p>

                <div class="suggestions">
                    <button class="suggestion" type="button"
                            data-question="RS-12 数字万用表如何测量直流电压？">
                        <span data-icon="message" data-icon-size="16" aria-hidden="true"></span>
                        <span>RS-12 数字万用表如何测量直流电压？</span>
                    </button>
                    <button class="suggestion" type="button"
                            data-question="设备无法开机时，应该按什么顺序排查？">
                        <span data-icon="message" data-icon-size="16" aria-hidden="true"></span>
                        <span>设备无法开机时，应该按什么顺序排查？</span>
                    </button>
                    <button class="suggestion" type="button"
                            data-question="如何正确接线并避免短路？">
                        <span data-icon="message" data-icon-size="16" aria-hidden="true"></span>
                        <span>如何正确接线并避免短路？</span>
                    </button>
                    <button class="suggestion" type="button"
                            data-question="在哪里可以查看产品的安全警告？">
                        <span data-icon="message" data-icon-size="16" aria-hidden="true"></span>
                        <span>在哪里可以查看产品的安全警告？</span>
                    </button>
                </div>
            </section>
        </div>
    </div>

    <button class="scroll-bottom" id="scrollBottom" type="button" aria-label="回到最新消息" hidden>
        <span data-icon="arrow-down" data-icon-size="16" aria-hidden="true"></span>
    </button>

    <div class="composer-wrap">
        <div class="composer">
            <label class="sr-only" for="input">输入问题</label>
            <textarea
                    id="input"
                    rows="1"
                    placeholder="输入问题，Enter 发送"
                    autocomplete="off"
                    spellcheck="false"></textarea>
            <button class="send-btn" id="sendBtn" type="button" aria-label="发送问题">
                <span data-icon="send" data-icon-size="18" aria-hidden="true"></span>
            </button>
            <button class="send-btn is-stop" id="stopBtn" type="button" aria-label="停止生成" hidden>
                <span data-icon="stop" data-icon-size="16" aria-hidden="true"></span>
            </button>
        </div>
        <div class="composer-meta">
            <span class="composer-hint">
                <span class="kbd">Enter</span> 发送 ·
                <span class="kbd">Shift</span> + <span class="kbd">Enter</span> 换行
            </span>
            <span class="status-line" id="statusLine" role="status" aria-live="polite"></span>
        </div>
    </div>
</main>

<noscript>
    <p style="padding:24px;text-align:center;">请启用 JavaScript 以使用智能问答。</p>
</noscript>

<script type="module" src="/front/assets/js/chat.js"></script>
</body>
</html>
